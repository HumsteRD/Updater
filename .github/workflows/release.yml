# Выпуск версии: тег vX.Y.Z → проверки, сборка Updater.exe и релиз в Releases.
#   git tag v1.1.1 && git push origin v1.1.1
#
# Версия программы берётся из тега (Directory.Build.props — только для локальной сборки).
# К exe прикладывается Updater.exe.sha256: без него уже выпущенные копии не станут обновляться.
name: Выпуск

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Сборка и проверки
        shell: pwsh
        run: |
          dotnet build Updater.sln -c Release -nologo
          if ($LASTEXITCODE) { throw "Сборка не прошла" }
          # Самопроверка пишет только во временную папку и в свою ветку реестра, которую потом удаляет.
          dotnet run --project tests/Updater.SelfCheck -c Release --no-build
          if ($LASTEXITCODE) { throw "Самопроверка нашла ошибки — выпуск остановлен" }

      - name: Updater.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/Updater.App/Updater.App.csproj -c Release -o publish -nologo -p:Version=$version
          if ($LASTEXITCODE -or -not (Test-Path publish/Updater.exe)) { throw "Updater.exe не собрался" }
          $fv = (Get-Item publish/Updater.exe).VersionInfo
          if ($fv.ProductName -ne "Updater" -or "$($fv.FileMajorPart).$($fv.FileMinorPart).$($fv.FileBuildPart)" -ne $version) {
            throw "Внутри Updater.exe версия $($fv.FileVersion), а тег $version — программа сама не обновится"
          }
          # Контрольная сумма: по ней программа проверяет скачанное обновление перед заменой себя.
          $hash = (Get-FileHash publish/Updater.exe -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("$PWD/publish/Updater.exe.sha256", "$hash  Updater.exe`n")
          "Updater.exe: {0:N1} МБ, SHA-256 {1}" -f ((Get-Item publish/Updater.exe).Length / 1MB), $hash

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Updater.exe
            publish/Updater.exe.sha256
          body: |
            ## Как пользоваться
            1. **На старой винде** скачайте **Updater.exe** ниже и запустите → «Начать сборы». Программа найдёт файлы,
               программы, их настройки, сохранения игр и настройки Windows. Выберите флешку или другой диск (не C:) —
               туда лягут вещи и сама программа.
            2. **Переустановите Windows**, не трогая диск со сборкой.
            3. **На новой винде** запустите `Updater.exe` из папки `Updater` на флешке → «Распаковать» → «Начать переезд».
               Драйверы, программы, файлы и настройки встанут сами.

            Windows может предупредить о неизвестном издателе: «Подробнее» → «Выполнить в любом случае».
            Программа не подписана сертификатом — это платная услуга; исходники открыты здесь же.

            Один файл, устанавливать не нужно: .NET уже внутри. Нужна 64-битная Windows 10 или 11; проверено на Windows 11.

            Начиная с 1.1.0 программа при запуске сама проверяет новую версию и обновляется (сверяет размер, SHA-256
            из `Updater.exe.sha256` и версию файла). Без интернета просто работает дальше.
          generate_release_notes: true
