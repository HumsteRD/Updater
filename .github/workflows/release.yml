# Выпуск версии: тег vX.Y.Z → проверки, сборка Updater.exe и релиз в Releases.
#   git tag v1.0.1 && git push origin v1.0.1
#
# Версия программы берётся из тега, поэтому Directory.Build.props перед выпуском править не нужно.
name: Выпуск

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Сборка и проверки
        shell: pwsh
        run: |
          dotnet build Updater.sln -c Release -nologo
          if ($LASTEXITCODE) { throw "Сборка не прошла" }
          # Самопроверка пишет только во временную папку и в свою ветку реестра, которую потом удаляет.
          dotnet run --project tests/Updater.SelfCheck -c Release --no-build
          if ($LASTEXITCODE) { throw "Самопроверка нашла ошибки — выпуск остановлен" }

      - name: Updater.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/Updater.App/Updater.App.csproj -c Release -o publish -nologo -p:Version=$version
          if ($LASTEXITCODE -or -not (Test-Path publish/Updater.exe)) { throw "Updater.exe не собрался" }
          "Updater.exe: {0:N1} МБ" -f ((Get-Item publish/Updater.exe).Length / 1MB)

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Updater.exe
          body: |
            ## Как пользоваться
            1. **На старой винде** скачайте **Updater.exe** ниже и запустите → «Начать сборы». Программа найдёт файлы,
               программы, их настройки, сохранения игр и настройки Windows. Выберите флешку или другой диск (не C:) —
               туда лягут вещи и сама программа.
            2. **Переустановите Windows**, не трогая диск со сборкой.
            3. **На новой винде** запустите `Updater.exe` из папки `Updater` на флешке → «Распаковать» → «Начать переезд».
               Драйверы, программы, файлы и настройки встанут сами.

            Windows может предупредить о неизвестном издателе: «Подробнее» → «Выполнить в любом случае».
            Программа не подписана сертификатом — это платная услуга; исходники открыты здесь же.

            Один файл, устанавливать не нужно: .NET уже внутри. Нужна 64-битная Windows 10 или 11; проверено на Windows 11.
          generate_release_notes: true
